<!doctype html>
<!-- Terugkeer na Inloggen met NL Wallet op dezelfde telefoon, uit moza-poc.
  Gegenereerd uit de build van moza-poc, met de CSS uit assets/moza. -->
<html lang="nl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Inloggen met NL Wallet</title>
		<link rel="stylesheet" href="/inloggen/assets/moza/style/style.css" />
		<meta name="description" content="MijnOverheid Zakelijk" />
		<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
	</head>
	<body class="page-login">
<header>
	<a class="skip-link btn-cta" href="#hoofd-inhoud">Ga naar hoofdinhoud</a>
	<div class="logo">
		<figure>
			<a href="/">
				<img src="/beeldmerk-rijksoverheid.svg" alt="Naar de homepage van MijnOverheid Zakelijk">
			</a>
		</figure>
		<a href="#" class="language-switch">English</a>
	</div>
	
	<a class="temp-moza-poc-banner" href="https://www.mijnoverheidzakelijk.nl/">Proof of Concept</a>
</header>
<main>
<article id="hoofd-inhoud" data-nl-wallet-terug>
	<h1>
		Inloggen met
		<b>NL Wallet</b>
	</h1>

	<div class="feedback feedback-info" data-nl-wallet-status="bezig" role="status">
		<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
	<path d="M22.04 3.78c-.16-.95-.88-1.67-1.83-1.83-2.73-.45-7.3-.45-8.21-.45-.91 0-5.48 0-8.22.46-.94.15-1.67.88-1.82 1.82C1.5 6.52 1.5 11.09 1.5 12s0 5.48.46 8.22c.16.95.88 1.67 1.83 1.83 2.74.46 7.3.46 8.22.46.91 0 5.48 0 8.22-.46.95-.16 1.67-.88 1.83-1.83.46-2.74.46-7.3.46-8.22-.02-2.74-.02-5.48-.48-8.22z" />

			<p>Uw gegevens worden opgehaald.</p>
		</div>
	</div>

	<div class="feedback feedback-success" hidden data-nl-wallet-status="ingelogd" role="status">
		<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
	<path fill-rule="evenodd" d="M22.04 3.78c-.16-.95-.88-1.67-1.83-1.83-2.73-.45-7.3-.45-8.21-.45-.91 0-5.48 0-8.22.46-.95.15-1.67.87-1.82 1.82C1.5 6.52 1.5 11.09 1.5 12s0 5.48.46 8.22c.16.95.88 1.67 1.83 1.83 2.74.46 7.3.46 8.22.46.91 0 5.48 0 8.22-.46.95-.16 1.67-.88 1.83-1.83.46-2.74.46-7.3.46-8.22-.02-2.74-.02-5.48-.48-8.22z M16.5 7.35a.755.755 0 0 0-1.01.1l-4.4 4.95-2.65-2.3a.743.743 0 0 0-.97 0c-.28.24-.35.65-.16.97l3.2 5.38c.14.23.38.37.64.37s.51-.14.64-.36l4.89-8.09c.21-.35.13-.78-.18-1.02z" />
</svg>

		<div>
			<p>U bent ingelogd als <b data-nl-wallet-naam></b> voor <b data-nl-wallet-onderneming></b>.</p>
			<p><a href="/" data-nl-wallet-vervolg>Verder naar MijnOverheid Zakelijk</a></p>
		</div>
	</div>

	<div class="feedback feedback-error" hidden data-nl-wallet-status="mislukt" role="alert">
		<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
	<circle cx="12" cy="12" r="10.5" />
	<path class="icon-color-inverse" d="M15.12 7.71 12 10.48 8.88 7.71a.858.858 0 0 0-1.15.02c-.3.32-.31.81-.02 1.14L10.48 12l-2.77 3.12c-.29.33-.29.83.02 1.14.32.3.81.31 1.14.02L12 13.52l3.12 2.77c.33.29.83.28 1.14-.02.3-.32.31-.81.02-1.14L13.52 12l2.77-3.12c.29-.33.29-.83-.02-1.14a.848.848 0 0 0-1.15-.03M12 12.01l-.01-.01.01-.01.01-.01.01.01.01.01-.03.01z" />

		<div>
			<p>Inloggen met NL Wallet is niet gelukt. Probeer het opnieuw of kies een ander inlogmiddel.</p>
			<p><a href="/inloggen/zakelijk">Opnieuw proberen</a></p>
		</div>
	</div>

	<script src="/inloggen/assets/moza/javascript/nl-wallet-inloggen.js" defer></script>
</article>
</main>
	</body>
</html>
