name: Deploy proef

# Zet main met de hand op de vaste omgeving "ux-fork" in ZAD (project
# "MOZa demo"). Daar wijst proef.moza.rijksapp.nl naar (publish-on-web).
# Het prototype staat nu op moza.mijnoverheidzakelijk.nl; proef toont alleen
# nog een verhuismelding (src/app/_movedNotice.tsx). Pull requests en pushes
# naar main zetten niets op ZAD. Uitrollen naar proef:
# Actions > Deploy proef > Run workflow, op main.
on:
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  ZAD_PROJECT_ID: md-a8y
  ZAD_COMPONENT: proef
  DEPLOYMENT_NAME: ux-fork

# Twee runs kort na elkaar: de tweede wacht, zodat een oudere build niet als
# laatste online komt.
concurrency:
  group: deploy-ux-fork

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # code uitchecken
      packages: write # image naar GHCR pushen
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR accepteert alleen image-namen in kleine letters (MinBZK -> minbzk).
      # Elke commit krijgt een eigen tag (<deployment>-<sha>), anders ziet ZAD
      # geen wijziging en blijft de oude container draaien. De tag <deployment>
      # wijst altijd naar de laatste build.
      - name: Bepaal image-naam
        id: image
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          base="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "name=${base}:${DEPLOYMENT_NAME}-${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest=${base}:${DEPLOYMENT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ux-fork
      url: https://proef.moza.rijksapp.nl/
    steps:
      - name: Deploy to ZAD
        id: deploy
        uses: RijksICTGilde/zad-actions/deploy@4217ceaa5c347f3c6d16142b5ad8ab94110c4cdb # v4.4.0
        with:
          # ZAD_API_KEY: API-key uit de ZAD Operations Manager
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: ${{ env.ZAD_PROJECT_ID }}
          deployment-name: ${{ env.DEPLOYMENT_NAME }}
          component: ${{ env.ZAD_COMPONENT }}
          image: ${{ needs.build.outputs.image }}
          # Neem instellingen (env vars, poort) over van de vaste deployment "proef"
          clone-from: proef
          comment-on-pr: false
          # De deployment hangt via publish-on-web aan proef.moza.rijksapp.nl;
          # de action zou een zelf samengesteld adres controleren dat niet
          # bestaat (404) en na 300 s falen.
          wait-for-ready: false
