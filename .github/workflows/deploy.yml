name: Deploy preview

# Elke pull request krijgt een eigen preview-omgeving op ZAD (project "MOZa demo").
# Bij het sluiten van de PR wordt de omgeving weer opgeruimd.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions: {}

env:
  REGISTRY: ghcr.io
  ZAD_PROJECT_ID: md-a8y
  ZAD_COMPONENT: proef

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read # code uitchecken
      packages: write # image naar GHCR pushen
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # GHCR accepteert alleen image-namen in kleine letters (MinBZK -> minbzk).
      # Elke commit krijgt een eigen tag (pr-<nr>-<sha>), anders ziet ZAD geen
      # wijziging en blijft de oude container draaien. De tag pr-<nr> wijst
      # altijd naar de laatste build en wordt gebruikt bij het opruimen.
      - name: Bepaal image-naam
        id: image
        env:
          PR_NUMBER: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "name=${base}:pr-${PR_NUMBER}-${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest=${base}:pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-preview:
    if: github.event.action != 'closed'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # URL van de preview als PR-comment plaatsen
    environment:
      name: pr-${{ github.event.pull_request.number }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Deploy to ZAD
        id: deploy
        uses: RijksICTGilde/zad-actions/deploy@5ad04045d781ed153ad75625305bf14d57496128 # v2.4.0
        with:
          # ZAD_API_KEY: API-key uit de ZAD Operations Manager
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: ${{ env.ZAD_PROJECT_ID }}
          deployment-name: pr-${{ github.event.pull_request.number }}
          component: ${{ env.ZAD_COMPONENT }}
          image: ${{ needs.build.outputs.image }}
          # Neem instellingen (env vars, poort) over van de vaste deployment "proef"
          clone-from: proef
          comment-on-pr: "true"
          wait-for-ready: "true"

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      deployments: write # GitHub-deployments van de PR verwijderen
      packages: write # PR-image uit GHCR verwijderen
      pull-requests: write # preview-comment verwijderen
    steps:
      - name: Cleanup ZAD deployment
        uses: RijksICTGilde/zad-actions/cleanup@5ad04045d781ed153ad75625305bf14d57496128 # v2.4.0
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: ${{ env.ZAD_PROJECT_ID }}
          deployment-name: pr-${{ github.event.pull_request.number }}
          delete-github-deployments: "true"
          delete-container: "true"
          container-org: ${{ github.repository_owner }}
          container-name: ${{ github.event.repository.name }}
          container-tag: pr-${{ github.event.number }}
